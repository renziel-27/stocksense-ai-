services:
  - type: web
    name: stocksense-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false   # Set this manually in Render dashboard
      - key: PYTHON_SERVICE_URL
        value: http://localhost:8000   # Update if deploying ML service separately
